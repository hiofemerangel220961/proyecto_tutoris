<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Panel Verificador - Sistema de Tutorías</title>
    <link rel="stylesheet" href="/static/css/auth/login.css">
</head>

<body>
    <div class="page-wrapper">
        <div class="login-card">
            <div class="login-logo">
                <span class="logo-placeholder">ST</span>
            </div>

            <div class="login-header">
                <h1>Panel de Verificador</h1>
                <p>Bienvenido, <strong>{{ user.nombres }} {{ user.apellidos }}</strong>.</p>
                <p>Has iniciado sesión como <strong>VERIFICADOR</strong>.</p>
            </div>

            <div style="margin-top: 16px; font-size: 0.95rem;">
                Aquí más adelante verás:
                <ul>
                    <li>Consultas de tutorías por estudiante</li>
                    <li>Seguimiento por tutor y semestre</li>
                    <li>Listas de estudiantes que pasaron tutoría</li>
                </ul>
            </div>

            <div style="margin-top: 16px; font-size: 0.85rem;">
                <a href="/login">Cerrar sesión</a>
            </div>
        </div>
    </div>
</body>

</html>
