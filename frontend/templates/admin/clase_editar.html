{% extends "base.html" %}

{% block title %}Editar Clase - Tutoris{% endblock %}

{% block extra_css %}
<style>
    .edit-container {
        background-color: #E8F0FE;
        border-radius: 12px;
        padding: 40px;
        max-width: 800px;
        margin-top: 20px;
    }

    .form-group {
        display: flex;
        align-items: center;
        margin-bottom: 25px;
    }

    .form-label {
        width: 150px;
        font-weight: 700;
        color: #1a1a1a;
        font-size: 1rem;
    }

    .form-select {
        flex: 1;
        height: 45px;
        padding: 0 15px;
        border-radius: 8px;
        border: none;
        background-color: #F5F5F5;
        font-size: 1rem;
        color: #333;
        outline: none;
        cursor: pointer;
        /* Custom arrow */
        appearance: none;
        background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23666' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
        background-repeat: no-repeat;
        background-position: right 15px center;
        background-size: 16px;
    }

    .form-select:focus {
        box-shadow: 0 0 0 2px #5B5FC7;
    }

    .form-actions {
        display: flex;
        justify-content: flex-end;
        gap: 20px;
        margin-top: 40px;
    }

    .btn-cancel {
        background-color: #5B5FC7;
        color: white;
        padding: 10px 40px;
        border-radius: 25px;
        border: none;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
        transition: opacity 0.2s;
    }

    .btn-save {
        background-color: #5B5FC7;
        color: white;
        padding: 10px 40px;
        border-radius: 25px;
        border: none;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
        transition: opacity 0.2s;
    }

    .btn-cancel:hover,
    .btn-save:hover {
        opacity: 0.9;
    }
</style>
{% endblock %}

{% block content %}
<h1 style="color: #311B92; margin-bottom: 20px;">Editar Clase</h1>

<div class="edit-container">
    <form action="/admin/clases/{{ clase.id }}/editar" method="POST">
        <div class="form-group">
            <label for="tutor" class="form-label">Tutor:</label>
            <select name="tutor_id" id="tutor" class="form-select">
                {% for tutor in tutores %}
                <option value="{{ tutor.id }}" {% if tutor.id==clase.tutor_id %}selected{% endif %}>
                    {{ tutor.usuario.nombres }} {{ tutor.usuario.apellidos }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="ambiente" class="form-label">Ambiente:</label>
            <select name="ambiente_id" id="ambiente" class="form-select">
                {% for ambiente in ambientes %}
                <option value="{{ ambiente.id }}" {% if ambiente.id==clase.ambiente_id %}selected{% endif %}>
                    {{ ambiente.codigo }} - {{ ambiente.tipo }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-actions">
            <a href="/admin/clases/{{ clase.id }}" class="btn-cancel">Cancelar</a>
            <button type="submit" class="btn-save">Guardar</button>
        </div>
    </form>
</div>
{% endblock %}
