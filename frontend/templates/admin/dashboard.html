<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Administrador - Sistema de Tutorías</title>
    <link rel="stylesheet" href="/static/css/auth/login.css">
</head>
<body>
    <div class="page-wrapper">
        <div class="login-card">
            <div class="login-logo">
                <span class="logo-placeholder">ST</span>
            </div>

            <div class="login-header">
                <h1>Panel de Administrador</h1>
                <p>Has iniciado sesión como <strong>ADMINISTRADOR</strong>.</p>
            </div>

            <div style="margin-top: 16px; font-size: 0.95rem;">
                Aquí más adelante irán las opciones de:
                <ul>
                    <li>Crear/gestionar cronogramas de tutorías</li>
                    <li>Gestionar tutores y clases</li>
                    <li>Ver historial de tutorías, etc.</li>
                </ul>
            </div>

            <div style="margin-top: 16px; font-size: 0.85rem;">
                <a href="/login">Cerrar sesión</a>
            </div>
        </div>
    </div>
</body>
</html>
