{% extends "base.html" %}

{% block title %}Nuevo Cronograma - Tutoris{% endblock %}

{% block content %}
<style>
    .program-container {
        padding: 30px 40px;
        width: 100%;
        max-width: 1400px;
        /* Much wider */
        box-sizing: border-box;
    }

    .page-title {
        font-size: 1.8rem;
        font-weight: 700;
        color: #1a237e;
        margin-bottom: 25px;
    }

    .form-card {
        background-color: #e5e9ff;
        /* Adjusted to a more periwinkle tone */
        border-radius: 10px;
        padding: 40px 80px;
        /* More horizontal padding */
        box-shadow: none;
        /* The image looks flat or very subtle */
    }

    .form-group {
        display: flex;
        align-items: center;
        margin-bottom: 25px;
    }

    .form-label {
        width: 180px;
        /* Slightly wider label area */
        font-weight: 600;
        color: #222;
        font-size: 0.95rem;
    }

    .form-input,
    .form-select,
    .form-textarea {
        flex: 1;
        width: 100%;
        /* Ensure it fills space */
        padding: 10px 15px;
        border: 1px solid #ccc;
        /* Softer border */
        border-radius: 6px;
        font-size: 0.95rem;
        background-color: white;
        height: 42px;
        /* Fixed height for inputs */
    }

    .form-select {
        appearance: none;
        background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23007CB2%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
        background-repeat: no-repeat;
        background-position: right 1rem center;
        background-size: .65em auto;
    }

    .form-textarea {
        resize: vertical;
        min-height: 120px;
    }

    .form-actions {
        display: flex;
        justify-content: flex-end;
        gap: 20px;
        margin-top: 40px;
    }

    .btn {
        padding: 12px 40px;
        border-radius: 25px;
        font-weight: 600;
        cursor: pointer;
        font-size: 1rem;
        border: none;
        transition: opacity 0.2s;
        text-decoration: none;
        display: inline-block;
        text-align: center;
    }

    .btn-cancel {
        background-color: #584cf4;
        /* Primary purple */
        color: white;
    }

    .btn-next {
        background-color: #584cf4;
        /* Primary purple */
        color: white;
    }

    .btn:hover {
        opacity: 0.9;
    }
</style>

<div class="program-container">
    <h1 class="page-title">{% if bloque %}Editar{% else %}Nuevo{% endif %} cronograma {{ "2025-II" }}</h1>

    <div class="form-card">
        <form action="/admin/tutorias/programar/{% if bloque %}{{ bloque.id }}/editar{% endif %}" method="POST">

            <!-- Carrera -->
            <div class="form-group">
                <label class="form-label" for="carrera">Carrera</label>
                <select name="carrera_id" id="carrera" class="form-select" required>
                    <option value="" disabled {% if not bloque %}selected{% endif %}>Seleccione una carrera</option>
                    {% for carrera in carreras %}
                    <option value="{{ carrera.id }}" {% if bloque and bloque.id_carrera==carrera.id %}selected{% endif
                        %}>{{ carrera.nombre }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Fecha inicio -->
            <div class="form-group">
                <label class="form-label" for="fecha_inicio">Fecha inicio:</label>
                <input type="date" name="fecha_inicio" id="fecha_inicio" class="form-input" required
                    value="{% if bloque %}{{ bloque.fecha_inicio.strftime('%Y-%m-%d') }}{% endif %}">
            </div>

            <!-- Fecha fin -->
            <div class="form-group">
                <label class="form-label" for="fecha_fin">Fecha fin:</label>
                <input type="date" name="fecha_fin" id="fecha_fin" class="form-input" required
                    value="{% if bloque %}{{ bloque.fecha_fin.strftime('%Y-%m-%d') }}{% endif %}">
            </div>

            <!-- Resumen -->
            <div class="form-group">
                <label class="form-label" for="resumen">Resumen:</label>
                <input type="text" name="resumen" id="resumen" class="form-input"
                    value="{% if bloque %}{{ bloque.resumen }}{% endif %}">
            </div>

            <!-- Descripción -->
            <div class="form-group" style="align-items: flex-start;">
                <label class="form-label" for="descripcion" style="margin-top: 12px;">Descripción</label>
                <textarea name="descripcion" id="descripcion"
                    class="form-textarea">{% if bloque %}{{ bloque.descripcion or '' }}{% endif %}</textarea>
            </div>

            <!-- Botones -->
            <div class="form-actions">
                <a href="/admin/dashboard" class="btn btn-cancel">Cancelar</a>
                <button type="submit" class="btn btn-next">Siguiente</button>
            </div>

        </form>
    </div>
</div>
{% endblock %}
