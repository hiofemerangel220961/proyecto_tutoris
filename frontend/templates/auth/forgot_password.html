<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recuperar contraseña - Sistema de Tutorías</title>
    <link rel="stylesheet" href="/static/css/auth/login.css">
</head>
<body>
    <div class="page-wrapper">
        <div class="login-card">
            <div class="login-logo">
                <span class="logo-placeholder">ST</span>
            </div>

            <div class="login-header">
                <h1>Recuperar contraseña</h1>
                <p>
                    Ingrese el correo asociado a su cuenta y le enviaremos un enlace
                    para cambiar la contraseña.
                </p>
            </div>

            <form id="forgot-form" class="login-form">
                <div class="form-group">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" required>
                </div>

                <p id="forgot-error" class="error" style="display:none;"></p>
                <p id="forgot-success" style="display:none; font-size:0.9rem; color:#16a34a;"></p>

                <button type="submit" class="btn-primary">Solicitar cambio de contraseña</button>
            </form>

            <div style="margin-top: 12px; font-size: 0.85rem;">
                <a href="/login">Volver al inicio de sesión</a>
            </div>
        </div>
    </div>

    <script src="/static/js/auth/forgot_password.js"></script>
</body>
</html>
