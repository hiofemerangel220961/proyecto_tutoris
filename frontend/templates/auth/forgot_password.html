<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recuperar contraseña - Sistema de Tutorías</title>
    <link rel="stylesheet" href="/static/css/auth/login.css">
</head>
<body>
    <div class="login-page">
        <div class="login-container">
            <!-- Panel izquierdo (igual que en login/registro) -->
            <div class="login-left">
                <div class="login-left-header">
                    <img src="/static/img/logo-tutoris.png" alt="Logo Tutoris" class="logo-image">
                </div>

                <div class="login-left-illustration">
                    <img src="/static/img/login-illustration.png"
                         alt="Ilustración de tutorías"
                         class="illustration-image">
                </div>

                <div class="login-left-text">
                    <h1>Bienvenido</h1>
                    <p>A tu sistema de gestión de tutorías UNSAAC</p>
                </div>
            </div>

            <!-- Panel derecho -->
            <div class="login-right">
                <div class="login-right-inner">
                    <header class="login-header">
                        <h2>Recuperar contraseña</h2>
                        <p>
                            Ingrese el correo asociado a su cuenta y le enviaremos un enlace
                            para cambiar la contraseña.
                        </p>
                    </header>

                    <form id="forgot-form" class="login-form">
                        <div class="form-group">
                            <label for="correo">*Correo electrónico</label>
                            <input type="email" id="correo" name="correo" required>
                        </div>

                        <p id="forgot-error" class="error" style="display:none;"></p>
                        <p id="forgot-success"
                           style="display:none; font-size:0.9rem; color:#16a34a;"></p>

                        <button type="submit" class="btn-primary">
                            Solicitar cambio de contraseña
                        </button>
                    </form>

                    <div style="margin-top: 12px; font-size: 0.85rem;">
                        <a href="/login">Volver al inicio de sesión</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/auth/forgot_password.js"></script>
</body>
</html>
