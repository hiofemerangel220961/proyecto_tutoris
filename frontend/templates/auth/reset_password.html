<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cambiar contraseña - Sistema de Tutorías</title>
    <link rel="stylesheet" href="/static/css/auth/login.css">
</head>
<body>
    <div class="page-wrapper">
        <div class="login-card">
            <div class="login-logo">
                <span class="logo-placeholder">ST</span>
            </div>

            <div class="login-header">
                <h1>Cambiar contraseña</h1>
                <p>
                    Ingrese su nueva contraseña para completar el proceso.
                </p>
            </div>

            <form id="reset-form" class="login-form">
                <!-- El token llega en la URL y se guarda aquí -->
                <input type="hidden" id="token" name="token">

                <div class="form-group">
                    <label for="nueva_contrasena">Nueva contraseña</label>
                    <input type="password" id="nueva_contrasena" name="nueva_contrasena" required>
                </div>

                <div class="form-group">
                    <label for="confirmar_contrasena">Confirmar contraseña</label>
                    <input type="password" id="confirmar_contrasena" name="confirmar_contrasena" required>
                </div>

                <p id="reset-error" class="error" style="display:none;"></p>
                <p id="reset-success" style="display:none; font-size:0.9rem; color:#16a34a;"></p>

                <button type="submit" class="btn-primary">Cambiar contraseña</button>
            </form>

            <div style="margin-top: 12px; font-size: 0.85rem;">
                <a href="/login">Volver al inicio de sesión</a>
            </div>
        </div>
    </div>

    <script src="/static/js/auth/reset_password.js"></script>
</body>
</html>
