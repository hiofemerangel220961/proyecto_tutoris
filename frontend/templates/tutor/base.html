<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Tutoris{% endblock %}</title>

  <!-- Reutilizamos el mismo CSS base del admin -->
  <link rel="stylesheet" href="/static/css/admin/dashboard.css" />
  {% block extra_css %}{% endblock %}
</head>

<body>
  <div class="layout-wrapper">

    <!-- SIDEBAR TUTOR -->
    <aside class="sidebar">
      <div>
        <div class="sidebar-header">
          <img src="/static/img/logo-tutoris.png" alt="Tutoris Logo" class="logo-img" />
          <span class="brand-text">Sistema de Tutorías Unsaac</span>
        </div>

        <ul class="nav-menu">
          <li class="nav-item {% if active_page == 'dashboard' %}active{% endif %}">
            <a href="/tutor/dashboard">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
              </svg>
              Inicio
            </a>
          </li>

          <li class="nav-item {% if active_page == 'nueva_sesion' %}active{% endif %}">
            <a href="/tutor/sesiones/nueva">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="12" y1="8" x2="12" y2="16"></line>
                <line x1="8" y1="12" x2="16" y2="12"></line>
              </svg>
              Iniciar nueva sesión
            </a>
          </li>

          <li class="nav-item {% if active_page == 'configuracion' %}active{% endif %}">
            <a href="/tutor/configuracion">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"></circle>
                <path
                  d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                </path>
              </svg>
              Configuración
            </a>
          </li>
        </ul>
      </div>

      <div class="sidebar-footer">
        <a href="/login" class="btn-logout">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          Salir
        </a>
      </div>
    </aside>

    <!-- CONTENIDO -->
    <main class="main-content">
      <header class="top-header">
        <div class="user-profile-section">
          <div class="notification-bell">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
              xmlns="http://www.w3.org/2000/svg">
              <path
                d="M12.02 2.90991C8.70997 2.90991 6.01997 5.59991 6.01997 8.90991V11.7999C6.01997 12.4099 5.75997 13.3399 5.44997 13.8599L4.29997 15.7699C3.58997 16.9599 4.07997 18.2599 5.37997 18.2599H18.66C19.96 18.2599 20.45 16.9599 19.74 15.7699L18.59 13.8599C18.28 13.3399 18.02 12.4099 18.02 11.7999V8.90991C18.02 5.60991 15.32 2.90991 12.02 2.90991Z"
                stroke="#6B7280" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round" />
              <path
                d="M15.02 19.0601C15.02 20.7101 13.67 22.0601 12.02 22.0601C11.2 22.0601 10.44 21.7201 9.90002 21.1801C9.36002 20.6401 9.02002 19.8801 9.02002 19.0601"
                stroke="#6B7280" stroke-width="1.5" stroke-miterlimit="10" />
            </svg>
            <span class="badge-dot"></span>
          </div>

          <div class="user-info-text">
            <a href="/tutor/perfil" class="user-name-top" title="Editar perfil">
              {{ user.nombres if user else 'Tutor' }} {{ user.apellidos if user else '' }}
            </a>
            <span class="user-role-top">Tutor</span>
          </div>

          <div class="avatar-circle">
            <svg style="width:20px;height:20px;color:#333;" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </div>
        </div>
      </header>

      {% block content %}{% endblock %}
    </main>

  </div>
</body>

</html>
